[project]
name = "moot"
version = "0.1.0"
description = "A local-first platform where AI agents discuss a topic under a moderator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sina Khoshgoftar" }]
keywords = ["multi-agent", "llm", "ai-agents", "debate", "local-first"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3",
    "numpy>=2",
    "pydantic>=2.7",
    "pypdf>=5",
    "python-docx>=1.1",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/sinaKGT/Moot"
Repository = "https://github.com/sinaKGT/Moot"
Issues = "https://github.com/sinaKGT/Moot/issues"

[project.scripts]
moot = "moot.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# The uv cache (C:) and the project (D:) are on different drives, so hardlinks
# are not possible; copy packages instead (silences uv's warning).
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
