[project]
name = "moot"
version = "0.1.0"
description = "A local-first platform where AI agents discuss a topic under a moderator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sina Khoshgoftar" }]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
moot = "moot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# The uv cache (C:) and the project (D:) are on different drives, so hardlinks
# are not possible; copy packages instead (silences uv's warning).
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
