<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moot · server test page</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e; --accent:#22d3ee; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { color:var(--accent); } header span { color:var(--dim); font-size:12px; }
  .wrap { display:grid; grid-template-columns:300px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); padding:12px; overflow:auto; display:flex; flex-direction:column; gap:14px; }
  main { display:grid; grid-template-rows:auto 1fr auto; min-height:0; }
  h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  input, select, button, textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; }
  button { cursor:pointer; width:auto; } button:hover { border-color:var(--accent); }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; } .row > * { flex:0 0 auto; }
  .grow { flex:1 1 auto !important; }
  #sessions div { padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  #sessions div:hover { border-color:var(--accent); } #sessions small { color:var(--dim); display:block; }
  #status { padding:8px 16px; border-bottom:1px solid var(--line); color:var(--dim); }
  #status b { color:var(--text); }
  #log { overflow:auto; padding:12px 16px; }
  .msg { margin:10px 0; white-space:pre-wrap; } .who { font-weight:700; }
  .note { color:var(--dim); margin:6px 0; white-space:pre-wrap; } .wait { color:var(--accent); font-weight:600; }
  .err { color:var(--bad); } .round { margin:18px 0 6px; font-weight:700; border-top:1px solid var(--line); padding-top:10px; }
  .poll { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:10px 0; }
  .bar { height:8px; background:var(--accent); border-radius:4px; }
  footer { border-top:1px solid var(--line); padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
  .muted { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header><b>Moot</b> server test page <span>A temporary page for checking the server. The real app comes later. API docs: <a href="/docs" style="color:var(--accent)">/docs</a></span></header>
<div class="wrap">
  <aside>
    <section>
      <h3>New demo discussion</h3>
      <label for="topic">Topic</label><input id="topic" placeholder="Should cities ban private cars from their centres?">
      <label for="provider">Provider</label><select id="provider"></select>
      <label for="model">Model</label><select id="model"></select>
      <div class="muted" id="modelNote"></div>
      <label><input type="checkbox" id="human" style="width:auto"> I moderate</label>
      <div id="humanFields" hidden>
        <label for="hname">Your name</label><input id="hname" value="Sina">
        <label for="hrole">Your role</label><input id="hrole" value="Judge">
      </div>
      <div class="row" style="margin-top:8px"><button id="create">Create and start</button></div>
    </section>
    <section>
      <div class="row"><h3 class="grow">Sessions</h3><button id="refresh">Refresh</button></div>
      <div id="sessions"></div>
    </section>
  </aside>
  <main>
    <div id="status">No session open.</div>
    <div id="log"></div>
    <footer>
      <div class="row"><input id="say" class="grow" placeholder="Say something; @Ava asks Ava directly, @all asks everyone"><button id="send">Send</button></div>
      <div class="row">
        <button data-act="pause">Pause</button><button data-act="resume">Resume</button>
        <button data-act="stop">Stop</button><button data-act="finish">Finish</button>
        <button data-act="next-round">Next round</button><button data-act="end-round">End round</button>
        <select id="floorAgent" style="width:auto"></select><button id="floor">Give floor</button>
        <button id="poll">Poll: strongest case</button>
      </div>
      <div class="muted" id="hint"></div>
    </footer>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
let current = null, source = null, names = {}, colors = {}, bubbles = {}, polls = {};

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) {
    let detail = response.statusText;
    try { const body = await response.json(); detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); } catch {}
    throw new Error(`${response.status}: ${detail}`);
  }
  return response.status === 204 ? null : response.json();
}
function el(tag, cls, text) { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined) node.textContent = text; return node; }
function add(node) { const log = $("log"); const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60; log.append(node); if (stick) log.scrollTop = log.scrollHeight; }
function note(text, cls = "note") { add(el("div", cls, text)); }
function hint(text) { $("hint").textContent = text; }

async function loadProviders() {
  const providers = await api("/api/providers");
  $("provider").replaceChildren(...providers.map((p) => {
    const missing = p.api_key_env && !p.key_set;
    const option = el("option", "", p.label + (p.local ? " (on this computer)" : "") + (missing ? " (no key)" : ""));
    option.value = p.id; return option;
  }));
  const usable = providers.find((p) => p.key_set) || providers.find((p) => p.local);
  if (usable) $("provider").value = usable.id;
  await loadModels();
}
async function loadModels() {
  $("model").replaceChildren(); $("modelNote").textContent = "Loading models...";
  try {
    const models = await api(`/api/providers/${$("provider").value}/models`);
    const sorted = [...models].sort((a, b) => (b.id.endsWith(":free") - a.id.endsWith(":free")) || a.id.localeCompare(b.id));
    $("model").replaceChildren(...sorted.map((m) => { const o = el("option", "", m.id); o.value = m.id; return o; }));
    const preferred = sorted.find((m) => m.id === "nvidia/nemotron-3-super-120b-a12b:free");
    if (preferred) $("model").value = preferred.id;
    $("modelNote").textContent = `${models.length} models`;
  } catch (error) { $("modelNote").textContent = `Couldn't list models: ${error.message}`; }
}
async function loadSessions() {
  const sessions = await api("/api/sessions");
  $("sessions").replaceChildren(...sessions.map((s) => {
    const item = el("div", "", s.topic); item.append(el("small", "", `${s.status} · ${s.agents.join(", ")}`));
    item.onclick = () => openSession(s.id); return item;
  }));
}
async function create() {
  const body = { provider: $("provider").value, model: $("model").value };
  if ($("topic").value.trim()) body.topic = $("topic").value.trim();
  if ($("human").checked) body.moderator = { kind: "human", display_name: $("hname").value.trim(), role: $("hrole").value.trim() || "Moderator" };
  try {
    const session = await api("/api/demo", { method: "POST", body: JSON.stringify(body) });
    await openSession(session.id);
    await api(`/api/sessions/${session.id}/start`, { method: "POST" });
    loadSessions();
  } catch (error) { note(error.message, "err"); }
}
async function openSession(id) {
  if (source) source.close();
  const view = await api(`/api/sessions/${id}`);
  current = view.summary; names = { user: "You", moderator: current.moderator, system: "System" }; colors = {};
  for (const agent of view.state.config.agents) { names[agent.id] = agent.name; colors[agent.id] = agent.color; }
  bubbles = {}; polls = {}; $("log").replaceChildren();
  $("floorAgent").replaceChildren(el("option", "", "Moot chooses"), ...view.state.config.agents.map((a) => { const o = el("option", "", a.name); o.value = a.name; return o; }));
  $("floorAgent").options[0].value = "";
  showStatus();
  source = new EventSource(`/api/sessions/${id}/events`);
  source.onmessage = () => {};
  for (const type of ["session_started","session_paused","session_resumed","session_ended","round_started","round_ended","turn_started","token_delta","turn_completed","moderator_decision","notebook_updated","alliance_changed","poll_opened","vote_cast","poll_closed","rule_violation","engine_notice","waiting_for_moderator","error"]) {
    source.addEventListener(type, (message) => handle(type, JSON.parse(message.data), view.state.config));
  }
}
function showStatus(extra = "") {
  if (!current) return;
  $("status").replaceChildren(el("b", "", current.topic), document.createTextNode(` · ${current.status}${extra ? " · " + extra : ""}`));
}
function speaker(id, replyTo) {
  const label = el("span", "who", names[id] || id); if (colors[id]) label.style.color = colors[id];
  const wrap = el("span"); wrap.append(label);
  if (replyTo && bubbles[replyTo]) wrap.append(document.createTextNode(` → ${names[bubbles[replyTo].speaker] || ""}`));
  wrap.append(document.createTextNode(": ")); return wrap;
}
function handle(type, e, config) {
  switch (type) {
    case "session_started": current.status = "running"; showStatus(); break;
    case "session_paused": current.status = "paused"; showStatus(); note("Paused"); break;
    case "session_resumed": current.status = "running"; showStatus(); note("Resumed"); break;
    case "session_ended": current.status = "finished"; showStatus(e.reason); note(`Discussion ${e.reason}.`, "round"); source.close(); loadSessions(); break;
    case "round_started": { const r = config.round_plan.rounds[e.round_index]; add(el("div", "round", `Round ${e.round_index + 1}: ${r.name}`)); note(r.instruction); hint(""); break; }
    case "turn_started": {
      if (e.purpose === "conclusion") add(el("div", "round", "Conclusion"));
      const box = el("div", "msg"); const text = el("span");
      box.append(speaker(e.speaker_id, e.reply_to), text); add(box);
      bubbles[e.message_id] = { text, speaker: e.speaker_id, box }; break;
    }
    case "token_delta": { const b = bubbles[e.message_id]; if (b) { b.text.textContent += e.text; const log = $("log"); log.scrollTop = log.scrollHeight; } break; }
    case "turn_completed":
      if (e.message.speaker_kind === "system") note("· " + e.message.text);
      else if (e.message.usage) bubbles[e.message.id]?.box.append(el("div", "muted", `${e.message.usage.prompt_tokens} in / ${e.message.usage.completion_tokens} out tokens`));
      break;
    case "moderator_decision": if (e.next_speaker_id) note(`· ${names.moderator} gives the floor to ${names[e.next_speaker_id]}${e.reason ? ": " + e.reason : ""}`); break;
    case "rule_violation": if (current.human_moderator) note(`! Rule reminder for ${names[e.agent_id]}: ${e.rule}`); break;
    case "alliance_changed": note(`· Alliance ${e.change}: ${e.agent_id ? names[e.agent_id] : ""}${e.targets.length ? " → " + e.targets.map((t) => names[t]).join(", ") : ""}${e.reason ? " (" + e.reason + ")" : ""}`); break;
    case "poll_opened": { const box = el("div", "poll"); box.append(el("b", "", "Poll: " + e.poll.question)); const votes = el("div", "muted", "Voting..."); box.append(votes); add(box); polls[e.poll.id] = { box, votes, poll: e.poll }; break; }
    case "vote_cast": { const p = polls[e.poll_id]; if (p) { p.count = (p.count || 0) + 1; p.votes.textContent = `${p.count} of ${p.poll.eligible_voters.length} voted`; } break; }
    case "poll_closed": { const p = polls[e.poll_id]; if (!p) break; p.votes.remove();
      for (const r of e.results) { const row = el("div"); row.append(el("div", "", `${r.label}: ${r.votes} vote${r.votes === 1 ? "" : "s"} (${Math.round(r.percent)}%)${r.voters.length ? " ← " + r.voters.map((v) => names[v]).join(", ") : ""}`));
        const bar = el("div", "bar"); bar.style.width = `${Math.max(r.percent, 1)}%`; row.append(bar); p.box.append(row); } break; }
    case "engine_notice": note("· " + e.message); break;
    case "waiting_for_moderator": {
      const r = config.round_plan.rounds[e.round_index];
      const text = e.waiting_for === "start_round" ? `Your move: press Next round to start round ${e.round_index + 1} (${r.name}).`
        : e.waiting_for === "next_speaker" ? "Who speaks next? Choose an agent and press Give floor, or End round / Next round."
        : "The round plan is done. Ask more or run a poll, then press Finish.";
      note("» " + text, "wait"); hint(text); break;
    }
    case "error": if (!e.agent_id) note("Error: " + e.message, "err"); break;
  }
}
async function act(path, body) {
  if (!current) return note("Open or create a session first.", "err");
  try { current = await api(`/api/sessions/${current.id}/${path}`, { method: "POST", body: body ? JSON.stringify(body) : undefined }); showStatus(); }
  catch (error) { note(error.message, "err"); }
}
$("provider").onchange = loadModels;
$("human").onchange = () => { $("humanFields").hidden = !$("human").checked; };
$("create").onclick = create;
$("refresh").onclick = loadSessions;
$("send").onclick = async () => { const text = $("say").value.trim(); if (!text) return; $("say").value = ""; await act("messages", { text }); };
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
for (const button of document.querySelectorAll("[data-act]")) button.onclick = () => act(button.dataset.act);
$("floor").onclick = () => act("floor", { agent: $("floorAgent").value || null });
$("poll").onclick = () => act("polls", {});
loadProviders().catch((error) => note(error.message, "err"));
loadSessions().catch(() => {});
</script>
</body>
</html>
